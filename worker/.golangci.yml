version: "2"

run:
  modules-download-mode: readonly
  tests: true
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
