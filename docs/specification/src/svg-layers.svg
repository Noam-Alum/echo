<svg viewBox="0 0 960 268" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,-apple-system,Helvetica Neue,sans-serif">
<style>
 .p{rx:6;stroke-width:1.4;fill:#fff}
 .hd{font-size:13px;font-weight:700;text-anchor:middle;fill:#fff}
 .hs{font-size:9px;text-anchor:middle;fill:#fff;opacity:.85;letter-spacing:.1em}
 .lb{font-size:9px;letter-spacing:.12em;font-weight:700}
 .it{font-size:10.5px;fill:#232a35}
 .no{font-size:10.5px;fill:#9b2c2c}
</style>
<rect class="p" x="16"  y="34" width="292" height="196" stroke="#2b6cb0"/>
<path d="M16,34 h292 a6,6 0 0 1 6,6 v34 h-304 v-34 a6,6 0 0 1 6,-6 z" fill="#2b6cb0"/>
<text class="hd" x="162" y="56">E.C.H.O planner</text><text class="hs" x="162" y="69">WHAT IS ALLOWED</text>
<text class="lb" x="32" y="98" fill="#2b6cb0">DECIDES</text>
<text class="it" x="32" y="118">Validates policy</text>
<text class="it" x="32" y="136">Assigns priority</text>
<text class="it" x="32" y="154">Confirms cluster, queue</text>
<text class="it" x="32" y="172">and GPU flavor</text>
<text class="lb" x="32" y="200" fill="#9b2c2c">MUST NOT</text>
<text class="no" x="32" y="219">Claim a physical GPU is reserved</text>

<rect class="p" x="334" y="34" width="292" height="196" stroke="#553c9a"/>
<path d="M334,34 h292 a6,6 0 0 1 6,6 v34 h-304 v-34 a6,6 0 0 1 6,-6 z" fill="#553c9a"/>
<text class="hd" x="480" y="56">Kueue</text><text class="hs" x="480" y="69">WHAT IS ADMITTED</text>
<text class="lb" x="350" y="98" fill="#553c9a">DECIDES</text>
<text class="it" x="350" y="118">Atomically reserves quota</text>
<text class="it" x="350" y="136">Fair-shares within a cohort</text>
<text class="it" x="350" y="154">Borrows idle capacity</text>
<text class="it" x="350" y="172">Preempts to reclaim it</text>
<text class="lb" x="350" y="200" fill="#9b2c2c">MUST NOT</text>
<text class="no" x="350" y="219">Choose the final node</text>

<rect class="p" x="652" y="34" width="292" height="196" stroke="#2f6f4e"/>
<path d="M652,34 h292 a6,6 0 0 1 6,6 v34 h-304 v-34 a6,6 0 0 1 6,-6 z" fill="#2f6f4e"/>
<text class="hd" x="798" y="56">Kubernetes scheduler</text><text class="hs" x="798" y="69">WHERE IT RUNS</text>
<text class="lb" x="668" y="98" fill="#2f6f4e">DECIDES</text>
<text class="it" x="668" y="118">Selects and binds the node</text>
<text class="it" x="668" y="136">Device plugin allocates the</text>
<text class="it" x="668" y="154">requested whole GPUs</text>
<text class="lb" x="668" y="200" fill="#9b2c2c">MUST NOT</text>
<text class="no" x="668" y="219">Apply organizational policy</text>

<path d="M308,20 L640,20" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
<path d="M626,20 L940,20" stroke="#9aa4b2" stroke-width="1.3" fill="none" marker-end="url(#ar)" opacity="0"/>
<text style="font-size:9.5px;fill:#8994a3;text-anchor:middle" x="474" y="14">authority narrows — no layer may pre-empt the next</text>

<text style="font-size:9.5px;fill:#5f6b7a" x="16" y="256">E.C.H.O observes the outcome of the two layers to its right; it never anticipates them. This is why no component counts free GPUs.</text>
</svg>
