<text class="s" x="337" y="95">training · research</text>
<rect class="b" x="424" y="44" width="142" height="58" stroke="#2c7a7b"/>
<text class="t" x="495" y="66" fill="#2c7a7b">echo-services-</text><text class="t" x="495" y="80" fill="#2c7a7b">controller</text>
<text class="s" x="495" y="95">inference</text>
<rect class="b" x="582" y="44" width="122" height="58" stroke="#553c9a"/>
<text class="t" x="643" y="66" fill="#553c9a">echo-project-</text><text class="t" x="643" y="80" fill="#553c9a">controller</text>
<text class="s" x="643" y="95">cluster-scoped</text>

<path class="e" d="M337,102 L337,148" stroke="#9b2c2c"/>
<path class="e" d="M255,148 L851,148" stroke="#9b2c2c"/>
<path class="e" d="M255,148 L255,204" stroke="#9b2c2c" marker-end="url(#ar-r)"/>
