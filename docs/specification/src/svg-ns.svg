<rect class="b" x="652" y="210" width="126" height="66" stroke="#9b2c2c" fill="#fdf3f3"/>
<text class="nt" x="715" y="234">echo-nlp-</text><text class="nt" x="715" y="248">training</text><text class="s" x="715" y="266">LocalQueue</text>
<rect class="b" x="788" y="210" width="126" height="66" stroke="#9b2c2c" fill="#fdf3f3"/>
<text class="nt" x="851" y="234">echo-nlp-</text><text class="nt" x="851" y="248">research</text><text class="s" x="851" y="266">LocalQueue</text>

<text class="g" x="40" y="330" fill="#553c9a">echo-project-controller  ·  CLUSTER-SCOPED PROVISIONING</text>
<rect x="40" y="338" width="880" height="48" rx="6" fill="#f7f4fc" stroke="#553c9a" stroke-width="1.2" stroke-dasharray="5 3"/>
<text class="s" x="480" y="358" style="font-size:11px">creates and reconciles, per project and per cluster — idempotently, with Server-Side Apply:</text>
<text class="s" x="480" y="375" style="font-size:11px;fill:#141821">Namespace · RoleBinding · ResourceQuota · NetworkPolicy · LocalQueue · model-storage access</text>
<path class="e" d="M643,102 L936,102 L936,312 L480,312 L480,334" stroke="#553c9a" stroke-dasharray="5 3" marker-end="url(#ar-p)"/>

<rect x="40" y="406" width="12" height="12" rx="2" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
<text class="el" x="58" y="416">echo-compute-controller — RoleBinding in every *-training and *-research namespace</text>
<rect x="40" y="428" width="12" height="12" rx="2" fill="#f0f7f7" stroke="#2c7a7b" stroke-width="1.3"/>
<text class="el" x="58" y="438">echo-services-controller — RoleBinding in every *-inference namespace</text>
<text class="el" x="470" y="416">The two workload identities hold disjoint permissions, so</text>
<text class="el" x="470" y="438">neither can act in the other's namespaces.</text>
</svg>
