<svg viewBox="0 0 960 452" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,-apple-system,Helvetica Neue,sans-serif">
<style>
 .b{fill:#fff;stroke-width:1.3;rx:4}
