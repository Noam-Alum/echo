</style>

<text class="g" x="250" y="16" fill="#4a5568">NAMESPACE  echo-access  ·  IDENTITIES ONLY, NO WORKLOADS</text>
<rect x="250" y="24" width="470" height="96" rx="8" fill="#f4f6f8" stroke="#9aa4b2" stroke-width="1.2"/>
<rect class="b" x="266" y="44" width="142" height="58" stroke="#9b2c2c"/>
