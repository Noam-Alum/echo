<text class="g" x="140" y="186" fill="#4a5568">PROJECT  vision</text>
<rect x="40" y="192" width="420" height="100" rx="8" fill="#fbfcfd" stroke="#c8d0da" stroke-width="1.2" stroke-dasharray="5 3"/>
<rect class="b" x="56"  y="210" width="126" height="66" stroke="#2c7a7b" fill="#f0f7f7"/>
