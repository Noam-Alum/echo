<svg viewBox="0 0 960 818" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,-apple-system,Helvetica Neue,sans-serif">
<style>
 .st{rx:5;stroke-width:1.5;fill:#fff}
 .t{font-size:12px;font-weight:600;text-anchor:middle;fill:#141821}
 .t2{font-size:11px;font-weight:600;text-anchor:middle;fill:#141821}
 .s{font-size:9px;text-anchor:middle;fill:#8994a3}
 .e{stroke:#4a5568;stroke-width:1.4;fill:none;marker-end:url(#ar)}
 .ep{stroke:#553c9a;stroke-width:1.4;fill:none;marker-end:url(#ar-p)}
 .er{stroke:#9b2c2c;stroke-width:1.3;fill:none;stroke-dasharray:5 3;marker-end:url(#ar-r)}
 .el{font-size:9.5px;fill:#5f6b7a}
 .lb{font-size:9px;letter-spacing:.13em;font-weight:700;fill:#8994a3}
</style>

<text class="lb" x="252" y="26">MAIN PATH</text>
<rect class="st" x="252" y="36" width="150" height="42" stroke="#5f6b7a"/><text class="t" x="327" y="62">Submitted</text>
<rect class="st" x="252" y="108" width="150" height="42" stroke="#5f6b7a"/><text class="t" x="327" y="134">Validating</text>
<rect class="st" x="252" y="180" width="150" height="42" stroke="#5f6b7a"/><text class="t" x="327" y="206">Queued</text>
<rect class="st" x="252" y="252" width="150" height="42" stroke="#5f6b7a"/><text class="t" x="327" y="278">Planning</text>
<rect class="st" x="252" y="324" width="150" height="42" stroke="#5f6b7a"/><text class="t" x="327" y="350">Dispatching</text>
<rect class="st" x="252" y="396" width="150" height="42" stroke="#5f6b7a"/><text class="t2" x="327" y="415">Waiting for</text><text class="t2" x="327" y="430">Admission</text>
<rect class="st" x="252" y="468" width="150" height="42" stroke="#5f6b7a"/><text class="t" x="327" y="494">Starting</text>
<rect class="st" x="252" y="540" width="150" height="46" stroke="#2b6cb0" stroke-width="2.2" fill="#f4f9fe"/><text class="t" x="327" y="568" fill="#2b6cb0">Running</text>

<path class="e" d="M327,78 L327,104"/><path class="e" d="M327,150 L327,176"/>
<path class="e" d="M327,222 L327,248"/><path class="e" d="M327,294 L327,320"/>
<path class="e" d="M327,366 L327,392"/><path class="e" d="M327,438 L327,464"/>
<path class="e" d="M327,510 L327,536"/>

<rect class="st" x="470" y="108" width="140" height="42" stroke="#9b2c2c" fill="#fdf3f3"/>
<text class="t" x="540" y="128" fill="#9b2c2c">Rejected</text><text class="s" x="540" y="142">terminal</text>
<path class="e" d="M402,129 L466,129"/><text class="el" x="412" y="122">policy</text>

<rect class="st" x="452" y="542" width="152" height="42" stroke="#5f6b7a"/>
<text class="t" x="528" y="561">Stopping</text><text class="s" x="528" y="575">drain and cleanup</text>
<path class="e" d="M402,563 L448,563"/>

<text class="lb" x="700" y="486">OUTCOMES</text>
<rect class="st" x="700" y="496" width="150" height="40" stroke="#2f6f4e" fill="#f3f9f5"/><text class="t" x="775" y="521" fill="#2f6f4e">Succeeded</text>
<rect class="st" x="700" y="546" width="150" height="40" stroke="#9b2c2c" fill="#fdf3f3"/><text class="t" x="775" y="571" fill="#9b2c2c">Failed</text>
<rect class="st" x="700" y="596" width="150" height="40" stroke="#8a5a12" fill="#fdf7ec"/><text class="t" x="775" y="621" fill="#8a5a12">Expired</text>
<path class="e" d="M604,552 L654,552 L654,516 L696,516"/>
<path class="e" d="M604,566 L696,566"/>
<path class="e" d="M604,576 L666,576 L666,616 L696,616"/>

<rect class="st" x="30" y="468" width="160" height="42" stroke="#553c9a" fill="#f7f4fc"/>
<text class="t" x="110" y="494" fill="#553c9a">Retrying</text>
<path class="ep" d="M252,556 L214,556 L214,489 L194,489"/>
<text class="el" x="150" y="534" fill="#553c9a">retryable failure</text>
<path class="ep" d="M110,468 L110,440 L14,440 L14,201 L248,201"/>
<text class="el" x="42" y="192" fill="#553c9a">re-planned and re-admitted</text>

<text class="lb" x="252" y="666">PINNED-PLACEMENT RECOVERY  ·  INFERENCE ONLY</text>
<rect class="st" x="252" y="678" width="150" height="42" stroke="#8a5a12" fill="#fdf7ec"/><text class="t" x="327" y="704" fill="#8a5a12">Unavailable</text>
<rect class="st" x="470" y="678" width="150" height="42" stroke="#553c9a" fill="#f7f4fc"/><text class="t" x="545" y="704" fill="#553c9a">Relocating</text>
<path class="e" d="M327,586 L327,674"/><text class="el" x="336" y="636">pinned node lost</text>
<path class="e" d="M402,699 L466,699"/><text class="el" x="410" y="692">Relocate</text>
<path class="e" d="M252,692 L228,692 L228,489 L248,489"/>
<text class="el" x="120" y="626">HoldPlacement —</text><text class="el" x="120" y="640">the node returns</text>
<path class="e" d="M620,692 L680,692 L680,462 L406,462"/>
<text class="el" x="688" y="686">new node ·</text><text class="el" x="688" y="700">generation + 1</text>

<text class="lb" x="30" y="710">CANCELLATION</text>
<rect class="st" x="30" y="746" width="150" height="40" stroke="#9b2c2c"/><text class="t" x="105" y="771" fill="#9b2c2c">Cancelling</text>
<rect class="st" x="252" y="746" width="150" height="40" stroke="#9b2c2c" fill="#fdf3f3"/>
<text class="t" x="327" y="766" fill="#9b2c2c">Cancelled</text><text class="s" x="327" y="779">terminal</text>
<path class="e" d="M180,766 L248,766"/>
<path class="er" d="M248,57 L206,57 L206,766 L26,766 L26,766" opacity="0"/>
<path class="er" d="M248,57 L206,57 L206,720 L105,720 L105,742"/>
<text class="el" x="432" y="772">Cancellation may be requested from any non-terminal state. It changes durable</text>
<text class="el" x="432" y="786">intent, so a delayed start command cannot revive the workload.</text>
<text class="el" x="432" y="806">Stopping also precedes Cancelled and Expired — anything running must be drained.</text>
</svg>
