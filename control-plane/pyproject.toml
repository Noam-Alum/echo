[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "echo-control-plane"
version = "0.1.1"
description = "E.C.H.O control-plane"


[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
echo-api = "echo.api.main:cli"
echo-planner = "echo.planner.main:cli"
echo-scanner = "echo.scanner.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["echo"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

